[project]
name = "five-year-platform-backend"
version = "1.0.0"
description = "五年建设任务管理平台后端"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.32,<1",
  "sqlalchemy>=2.0,<3",
  "alembic>=1.14,<2",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.6,<3",
  "PyJWT>=2.9,<3",
  "pwdlib[argon2]>=0.2,<1",
  "python-multipart>=0.0.12,<1",
  "openpyxl>=3.1,<4",
]

[project.optional-dependencies]
test = ["pytest>=8.3,<9", "httpx>=0.27,<1"]
postgresql = ["psycopg[binary]>=3.2,<4"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
