# 生产编排：mysql 8 + backend + frontend
# 用法：
#   1. 复制 .env.example 为 .env 并填写（DB_PASSWORD / JWT_SECRET / FILE_SIGN_SECRET 必须更换；飞书按需）
#   2. docker compose -f docker-compose.prod.yml --env-file .env up -d --build
# 说明：本文件中的 ${...} 默认值仅用于本地起 stack 验证，生产一律以 .env 为准
version: "3.8"

services:
  mysql:
    image: mysql:8.0
    container_name: metrics-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:?请在 .env 中设置 DB_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME:-metrics_db}
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+08:00
      - --skip-log-bin
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_PASSWORD:?请在 .env 中设置 DB_PASSWORD}"]
      interval: 5s
      timeout: 3s
      retries: 30
    networks:
      - metrics

  backend:
    build: ./backend
    image: metrics-backend:latest
    container_name: metrics-backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      SERVER_PORT: 8080
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-metrics_db}
      DB_USER: ${DB_USER:-root}
      DB_PASSWORD: ${DB_PASSWORD:?请在 .env 中设置 DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?请在 .env 中设置 JWT_SECRET}
      JWT_ACCESS_EXPIRE_MINUTES: ${JWT_ACCESS_EXPIRE_MINUTES:-120}
      JWT_REFRESH_EXPIRE_DAYS: ${JWT_REFRESH_EXPIRE_DAYS:-7}
      FILE_STORAGE_TYPE: ${FILE_STORAGE_TYPE:-LOCAL}
      FILE_STORAGE_DIR: /app/data/files
      FILE_SIGNED_URL_EXPIRE_MINUTES: ${FILE_SIGNED_URL_EXPIRE_MINUTES:-10}
      FILE_SIGN_SECRET: ${FILE_SIGN_SECRET:?请在 .env 中设置 FILE_SIGN_SECRET}
      KKFILEVIEW_URL: ${KKFILEVIEW_URL:-}
      # 生产关闭接口文档（API 约定第 14 章）
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-false}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      SCREEN_CACHE_SECONDS: ${SCREEN_CACHE_SECONDS:-120}
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-true}
      RATE_LIMIT_LOGIN_PER_MINUTE: ${RATE_LIMIT_LOGIN_PER_MINUTE:-10}
      RATE_LIMIT_API_PER_MINUTE: ${RATE_LIMIT_API_PER_MINUTE:-300}
      RATE_LIMIT_EXPORT_PER_MINUTE: ${RATE_LIMIT_EXPORT_PER_MINUTE:-5}
      REMINDER_ENABLED: ${REMINDER_ENABLED:-true}
      REMINDER_CRON: ${REMINDER_CRON:-0 30 8 * * ?}
      # 飞书集成（不配置则集成整体不可用：免登 20006、推送 SKIPPED、事件回调拒绝验签）
      FEISHU_APP_ID: ${FEISHU_APP_ID:-}
      FEISHU_APP_SECRET: ${FEISHU_APP_SECRET:-}
      FEISHU_REDIRECT_URI: ${FEISHU_REDIRECT_URI:-}
      FEISHU_ENCRYPT_KEY: ${FEISHU_ENCRYPT_KEY:-}
      FEISHU_VERIFICATION_TOKEN: ${FEISHU_VERIFICATION_TOKEN:-}
      FEISHU_APP_BASE_URL: ${FEISHU_APP_BASE_URL:-}
      FEISHU_PUSH_ENABLED: ${FEISHU_PUSH_ENABLED:-true}
      FEISHU_PUSH_INTERVAL_MS: ${FEISHU_PUSH_INTERVAL_MS:-60000}
    volumes:
      - metrics-files:/app/data/files
    networks:
      - metrics
    # 不对外暴露端口，仅经 frontend nginx 反代
    expose:
      - "8080"

  frontend:
    build: ./frontend
    image: metrics-frontend:latest
    container_name: metrics-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-80}:80"
    networks:
      - metrics

networks:
  metrics:

volumes:
  mysql-data:
  metrics-files:
